<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Private administration area for Doana Digital."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>
    Doana Digital — Admin
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body>


<main class="section">

  <div
    class="container"
    style="max-width:1100px;"
  >


    <!-- ========================================
         ADMIN LOGIN
    ========================================= -->

    <section
      id="adminLogin"
      class="admin-login-section"
    >

      <div
        style="max-width:560px; margin:0 auto;"
      >

        <div class="kicker">
          Doana Digital
        </div>


        <h1>
          Admin Login
        </h1>


        <p class="lead">

          Sign in to review and manage
          client feedback.

        </p>


        <form id="adminLoginForm">


          <!-- EMAIL -->

          <label for="adminEmail">
            Email
          </label>


          <input
            id="adminEmail"
            name="email"
            type="email"
            autocomplete="username"
            required
            placeholder="Admin email"
          >



          <!-- PASSWORD -->

          <label for="adminPassword">
            Password
          </label>


          <input
            id="adminPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="8"
            placeholder="Password"
          >



          <!-- SIGN IN -->

          <button
            id="adminLoginButton"
            class="btn btn-primary"
            type="submit"
          >
            Sign In
          </button>



          <!-- FORGOT PASSWORD -->

          <button
            id="forgotPassword"
            class="btn btn-secondary"
            type="button"
            style="margin-left:10px;"
          >
            Forgot password?
          </button>



          <!-- LOGIN STATUS -->

          <div
            id="adminLoginMessage"
            class="success"
            role="status"
            aria-live="polite"
          ></div>



          <!-- RESET EMAIL STATUS -->

          <div
            id="resetMessage"
            class="success"
            role="status"
            aria-live="polite"
          ></div>


        </form>

      </div>

    </section>



    <!-- ========================================
         ADMIN DASHBOARD
    ========================================= -->

    <section
      id="adminDashboard"
      style="display:none;"
    >


      <!-- HEADER -->

      <div class="admin-header">

        <div>

          <div class="kicker">
            Feedback moderation
          </div>


          <h1>
            Client Reviews
          </h1>


          <p class="lead">

            Review submitted testimonials before
            they appear publicly on the Doana website.

          </p>

        </div>



        <button
          id="adminLogout"
          class="btn btn-secondary"
          type="button"
        >
          Sign Out
        </button>

      </div>



      <!-- ====================================
           DASHBOARD SUMMARY
      ===================================== -->

      <div class="admin-summary">

        <div class="admin-summary-card">

          <span class="admin-summary-label">
            Pending
          </span>

          <strong
            id="pendingCount"
            class="admin-summary-number"
          >
            —
          </strong>

        </div>


        <div class="admin-summary-card">

          <span class="admin-summary-label">
            Approved
          </span>

          <strong
            id="approvedCount"
            class="admin-summary-number"
          >
            —
          </strong>

        </div>


        <div class="admin-summary-card">

          <span class="admin-summary-label">
            Rejected
          </span>

          <strong
            id="rejectedCount"
            class="admin-summary-number"
          >
            —
          </strong>

        </div>

      </div>



      <!-- ====================================
           FILTERS
      ===================================== -->

      <div
        class="admin-filters"
        aria-label="Review filters"
      >

        <button
          class="btn admin-filter active"
          data-status="pending"
          type="button"
        >
          Pending
        </button>


        <button
          class="btn admin-filter"
          data-status="approved"
          type="button"
        >
          Approved
        </button>


        <button
          class="btn admin-filter"
          data-status="rejected"
          type="button"
        >
          Rejected
        </button>


        <button
          class="btn admin-filter"
          data-status="all"
          type="button"
        >
          All
        </button>

      </div>



      <!-- ====================================
           REVIEW STATUS MESSAGE
      ===================================== -->

      <div
        id="adminActionMessage"
        class="success"
        role="status"
        aria-live="polite"
      ></div>



      <!-- ====================================
           REVIEW LIST
      ===================================== -->

      <div id="adminReviewList">

        <p class="note">
          Loading reviews...
        </p>

      </div>


    </section>

  </div>

</main>



<!-- ========================================
     ADMIN JAVASCRIPT
======================================== -->

<script src="admin.js"></script>


</body>

</html>
