<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Reset Password — Doana Digital
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


<main class="section">

  <div
    class="container"
    style="max-width:620px;"
  >


    <div class="kicker">
      Doana Digital
    </div>


    <h1>
      Reset password
    </h1>


    <p class="lead">

      Enter a new password for your
      Doana admin account.

    </p>


    <form id="resetPasswordForm">


      <label for="newPassword">
        New Password
      </label>


      <input
        id="newPassword"
        type="password"
        required
        minlength="10"
        autocomplete="new-password"
        placeholder="Enter your new password"
      >


      <label for="confirmPassword">
        Confirm Password
      </label>


      <input
        id="confirmPassword"
        type="password"
        required
        minlength="10"
        autocomplete="new-password"
        placeholder="Confirm your new password"
      >


      <button
        id="resetPasswordButton"
        class="btn btn-primary"
        type="submit"
      >
        Update Password
      </button>


      <div
        id="passwordResetStatus"
        class="success"
        role="status"
        aria-live="polite"
      ></div>


    </form>


  </div>

</main>


<script src="reset-password.js"></script>

</body>

</html>
